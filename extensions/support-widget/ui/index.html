<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服浮窗配置</title><link rel="stylesheet" href="config.css"><link rel="stylesheet" href="config-recovery.css"><script defer src="config.js"></script></head><body>
<main class="settings">
<header class="heading"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-6 4z"/><path d="M7 9h.01M12 9h.01M17 9h.01"/></svg></div><div><p class="eyebrow">APITOKEN / SUPPORT</p><h1 data-copy="title">客服浮窗配置</h1><p class="subtitle" data-copy="subtitle">让访客在网站右侧找到客服与 QQ 群。</p></div><select id="language" aria-label="语言 / Language"><option value="zh">简体中文</option><option value="en">English</option></select></header>
<p class="lifecycle" data-copy="lifecycle">启用、停用和卸载请使用插件管理页面的操作按钮。</p>
<p id="loading" role="status" data-copy="loading">正在读取插件配置…</p><p id="error" class="error" role="alert" tabindex="-1" hidden></p><div class="recovery-actions"><button id="retry" type="button" class="secondary" data-copy="retry" hidden>重新读取</button><button id="recover" type="button" class="secondary" data-copy="recover" hidden>重新填写联系方式</button></div>
<section id="recovery-confirm" class="recovery-confirm" aria-labelledby="recovery-title" hidden><h2 id="recovery-title" data-copy="recoveryTitle">配置无法读取</h2><p data-copy="recoveryWarning">旧配置未能读取或解密。确认后将打开空白联系方式表单；只有点击保存才会替换本插件的整份旧配置。旧值不会自动恢复，请先重试或核对备份。</p><div class="recovery-actions"><button id="cancel-recovery" type="button" class="secondary" data-copy="cancelRecovery">返回</button><button id="confirm-recovery" type="button" class="danger" data-copy="confirmRecovery">确认并重新填写</button></div></section>
<p id="recovery-banner" class="recovery-banner" role="status" data-copy="recoveryBanner" hidden>恢复模式：保存会替换无法读取的旧配置，请核对联系方式和链接。</p>
<form id="form" novalidate hidden><fieldset id="fields"><div class="grid"><div class="fields">
<div class="field-grid"><div><label for="title" data-copy="panelTitle">面板标题</label><input id="title" name="title" maxlength="40"></div><div><label for="service_label" data-copy="serviceLabel">客服入口名称</label><input id="service_label" name="service_label" maxlength="40"></div></div>
<div><label for="description" data-copy="description">欢迎语（可选）</label><textarea id="description" name="description" rows="2" maxlength="160" placeholder="我们自己也在用，有问题一起解决。"></textarea></div>
<div class="field-grid"><div><label for="service_contact" data-copy="contact">客服联系方式（可选）</label><input id="service_contact" name="service_contact" maxlength="100" placeholder="QQ 号、微信号或邮箱"><p class="hint" data-copy="contactHint">访客可以一键复制。</p></div><div><label for="service_url" data-copy="serviceURL">客服链接（可选）</label><input id="service_url" name="service_url" maxlength="2048" inputmode="url" placeholder="https://…"><p class="hint" data-copy="urlHint">填写完整的 HTTP / HTTPS 链接。</p></div></div>
<div class="field-grid"><div><label for="qq_group_number" data-copy="group">QQ 群号（可选）</label><input id="qq_group_number" name="qq_group_number" maxlength="12" inputmode="numeric" placeholder="5–12 位群号码"></div><div><label for="qq_group_url" data-copy="groupURL">加群链接（可选）</label><input id="qq_group_url" name="qq_group_url" maxlength="2048" inputmode="url" placeholder="https://…"></div></div>
<label class="checkbox"><input id="use_ticket" name="use_ticket" type="checkbox"><span><strong data-copy="ticket">显示网站工单入口</strong><small data-copy="ticketHint">网站工单功能开启时，访客可登录后提交问题。</small></span></label>
</div><aside class="preview" aria-label="面板预览"><p class="eyebrow" data-copy="preview">面板预览</p><div class="preview-card"><span class="preview-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-6 4z"/><path d="M7 9h.01M12 9h.01M17 9h.01"/></svg></span><h2 id="preview-title"></h2><p id="preview-description"></p><div id="preview-service" class="preview-item"><strong id="preview-service-label"></strong><span id="preview-contact"></span></div><div id="preview-group" class="preview-item"><strong data-copy="qqLabel">QQ 交流群</strong><span id="preview-qq"></span></div><p id="preview-empty" data-copy="empty" hidden>添加联系方式后，这里会显示入口。</p></div><p class="hint" data-copy="publicHint">插件启用后，这些联系方式将对网站访客公开。</p></aside></div>
<footer><p id="status" role="status" aria-live="polite"></p><button id="save" type="button" class="primary" disabled data-copy="save">保存插件配置</button></footer></fieldset></form>
</main></body></html>
